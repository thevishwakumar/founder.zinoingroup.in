<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Subtle Network Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central Ambient Glow -->
  <circle cx="400" cy="240" r="160" fill="rgba(59, 130, 246, 0.12)" filter="url(#glow)" />

  <!-- Certificate Shield / Document Container -->
  <g transform="translate(250, 80)">
    <!-- Certificate Shadow -->
    <rect x="5" y="10" width="290" height="320" rx="16" fill="rgba(0,0,0,0.4)" filter="url(#glow)" />
    <!-- Certificate Base Card -->
    <rect x="0" y="0" width="300" height="320" rx="16" fill="#131c2e" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />
    
    <!-- Top Accent Bar -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L284 0 C292.84 0 300 7.16 300 16 L300 48 L0 48 Z" fill="url(#primaryGrad)" />
    
    <!-- Header Title -->
    <text x="24" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="1">STUDENT CREDENTIAL VERIFIED</text>
    
    <!-- Badge / Shield Icon -->
    <g transform="translate(118, 70)">
      <circle cx="32" cy="32" r="32" fill="url(#primaryGrad)" />
      <!-- Checkmark -->
      <path d="M22 32 L29 39 L42 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Certificate Mock Lines -->
    <rect x="40" y="155" width="220" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="60" y="175" width="180" height="8" rx="4" fill="rgba(255,255,255,0.12)" />
    <rect x="75" y="195" width="150" height="8" rx="4" fill="rgba(255,255,255,0.08)" />

    <!-- Metadata Badges -->
    <g transform="translate(35, 230)">
      <!-- Geolocation Verified Pill -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">GPS VERIFIED</text>
      
      <!-- Timestamp Pill -->
      <rect x="120" y="0" width="110" height="26" rx="6" fill="rgba(99, 102, 241, 0.12)" stroke="#6366f1" stroke-width="1" />
      <text x="133" y="17" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#818cf8">PROOF ENGINE</text>
    </g>

    <!-- Bottom Hash -->
    <text x="40" y="295" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.35)">SHA-256: 8f4a21...c90b2e</text>
  </g>

  <!-- Surrounding Nodes and Connections -->
  <g stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4,4">
    <line x1="160" y1="240" x2="250" y2="240" />
    <line x1="550" y1="240" x2="640" y2="240" />
  </g>

  <!-- Left Node -->
  <circle cx="160" cy="240" r="28" fill="#131c2e" stroke="#3b82f6" stroke-width="2" />
  <text x="160" y="244" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">STUDENT</text>

  <!-- Right Node -->
  <circle cx="640" cy="240" r="28" fill="#131c2e" stroke="#6366f1" stroke-width="2" />
  <text x="640" y="244" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#a5b4fc" text-anchor="middle">CAMPUS</text>
</svg>

