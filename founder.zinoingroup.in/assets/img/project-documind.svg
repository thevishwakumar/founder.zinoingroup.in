<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#131f37" />
    </linearGradient>
    <linearGradient id="dmPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="dmAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="dmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#dmBgGrad)" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Ambient Vector Glow -->
  <circle cx="400" cy="230" r="150" fill="rgba(56, 189, 248, 0.1)" filter="url(#dmGlow)" />

  <!-- Central Architecture Card -->
  <g transform="translate(180, 65)">
    <!-- Base Card Frame -->
    <rect x="0" y="0" width="440" height="350" rx="16" fill="#0f172a" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Top Header Banner -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L424 0 C432.84 0 440 7.16 440 16 L440 46 L0 46 Z" fill="url(#dmPrimaryGrad)" />
    
    <!-- Top Terminal Dots -->
    <circle cx="24" cy="23" r="5" fill="#f87171" />
    <circle cx="40" cy="23" r="5" fill="#facc15" />
    <circle cx="56" cy="23" r="5" fill="#4ade80" />
    
    <!-- Header Title -->
    <text x="80" y="28" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">DOCUMIND AI — RAG KNOWLEDGE SYSTEM</text>

    <!-- Node 1: Ingestion -->
    <g transform="translate(25, 75)">
      <rect width="115" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="57" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">DOCUMENTS</text>
      <text x="57" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">PDF • DOCX • TXT</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M145 112 L175 112" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#dmArrow)" />
    <polygon points="175,108 183,112 175,116" fill="#38bdf8" />

    <!-- Node 2: Vector DB -->
    <g transform="translate(185, 75)">
      <rect width="115" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="57" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">ChromaDB</text>
      <text x="57" y="52" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Vector Search</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M305 112 L335 112" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />
    <polygon points="335,108 343,112 335,116" fill="#38bdf8" />

    <!-- Node 3: LLM Engine -->
    <g transform="translate(345, 75)">
      <rect width="70" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="35" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#facc15" text-anchor="middle">Gemini AI</text>
      <text x="35" y="52" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Generation</text>
    </g>

    <!-- Lower Section: Security & Architecture Features -->
    <g transform="translate(25, 175)">
      <rect width="390" height="145" rx="8" fill="#131f37" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">ENTERPRISE SECURITY &amp; MULTI-TENANCY</text>
      
      <!-- Feature Pills -->
      <g transform="translate(20, 48)">
        <rect width="165" height="28" rx="6" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#38bdf8">✓ Role-Based Access (RBAC)</text>
      </g>
      <g transform="translate(195, 48)">
        <rect width="175" height="28" rx="6" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#38bdf8">✓ Multi-Tenant Isolation</text>
      </g>

      <g transform="translate(20, 88)">
        <rect width="165" height="28" rx="6" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#38bdf8">✓ JWT &amp; bcrypt Auth</text>
      </g>
      <g transform="translate(195, 88)">
        <rect width="175" height="28" rx="6" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
        <text x="12" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#38bdf8">✓ Automated QA Test Suites</text>
      </g>
    </g>
  </g>
</svg>
